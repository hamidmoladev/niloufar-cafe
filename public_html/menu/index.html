<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منو | کافه کیک نیلوفر</title>
    <meta name="description" content="منوی کافه کیک نیلوفر — هر فنجان، یک حال خوب">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <!-- Hero -->
        <header class="hero">
            <div class="logo-wrap">
                <img src="../assets/logo.png" alt="کافه کیک نیلوفر" class="logo-full" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div style="display:none; font-size:3rem; color:var(--pink);">🌸</div>
            </div>
            <h1 class="hero-title">کافه کیک نیلوفر</h1>
            <p class="hero-subtitle">هر فنجان، یک حال خوب</p>
            <div class="hero-divider"></div>
        </header>

        <!-- Menu -->
        <section class="menu-section" aria-label="دسته‌بندی‌های منو">
            <div class="section-heading">
                <h2>منوی ما</h2>
                <span class="section-line"></span>
            </div>

            <div class="category-grid">
                <a href="hot.html" class="category-card">
                    <div class="category-art art-hot"></div>
                    <span class="category-label">بار گرم</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="cold.html" class="category-card">
                    <div class="category-art art-cold"></div>
                    <span class="category-label">بار سرد</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="frappe.html" class="category-card">
                    <div class="category-art art-frappe"></div>
                    <span class="category-label">فراپه (شیک)</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="smoothie.html" class="category-card">
                    <div class="category-art art-smoothie"></div>
                    <span class="category-label">معجون</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="icecream.html" class="category-card">
                    <div class="category-art art-icecream"></div>
                    <span class="category-label">بستنی</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="tea.html" class="category-card">
                    <div class="category-art art-tea"></div>
                    <span class="category-label">چای و دمنوش</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>

                <a href="cake.html" class="category-card category-card-wide">
                    <div class="category-art art-cake"></div>
                    <span class="category-label">کیک و دسر</span>
                    <span class="category-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </span>
                </a>
            </div>
        </section>

        <!-- Footer -->
        <footer class="site-footer">
            <p>با افتخار برای شما سرو می‌شود 🌸</p>
            <span class="footer-brand">Niloufar Café</span>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
