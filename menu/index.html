<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منوی کافه کیک نیلوفر</title>
  <meta name="description" content="منوی آنلاین کافه کیک نیلوفر — بار گرم، بار سرد، فراپه، معجون، بستنی، چای و دمنوش، کیک و دسر. More Than Just a Drink.">
  <link rel="icon" type="image/png" href="images/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="menu-page">

    <div class="background-decor" aria-hidden="true">
      <img class="edge-photo top-left" loading="lazy" src="images/bg-top-left.jpg" alt="">
      <img class="edge-photo top-right" loading="lazy" src="images/bg-top-right.jpg" alt="">
      <img class="edge-photo bottom-left" loading="lazy" src="images/bg-bottom-left.jpg" alt="">
      <img class="edge-photo bottom-right" loading="lazy" src="images/bg-bottom-right.jpg" alt="">
    </div>

    <div class="page-shell">
      <header class="brand" aria-label="کافه کیک نیلوفر">
        <div class="logo-ring">
          <img src="images/logo.png" alt="لوگوی صورتی کافه کیک نیلوفر با گل نیلوفر">
        </div>
        <h1 class="brand-title">NILOUFAR</h1>
        <p class="brand-type">CAFE • CAKE</p>
        <div class="ornamental-divider"></div>
        <p class="welcome">More Than Just a Drink</p>
      </header>

      <main aria-label="منوی آنلاین کافه نیلوفر">

        <section id="home-view" class="home-view" aria-label="دسته‌بندی‌های منو">
          <nav class="menu-grid" aria-label="دسته‌بندی‌های منو">

            <button type="button" class="category-button full" data-category="dessert">
              <i data-lucide="cake-slice" class="category-icon"></i>
              <span class="category-name">کیک و دسر</span>
              <span class="category-en">CAKE &amp; DESSERT</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="hot">
              <i data-lucide="coffee" class="category-icon"></i>
              <span class="category-name">بار گرم</span>
              <span class="category-en">HOT BAR</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="cold">
              <i data-lucide="cup-soda" class="category-icon"></i>
              <span class="category-name">بار سرد</span>
              <span class="category-en">COLD BAR</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="frappe">
              <i data-lucide="milk" class="category-icon"></i>
              <span class="category-name">فراپه (شیک)</span>
              <span class="category-en">FRAPPE</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="majoon">
              <i data-lucide="glass-water" class="category-icon"></i>
              <span class="category-name">معجون</span>
              <span class="category-en">SMOOTHIE</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="ice">
              <i data-lucide="ice-cream-cone" class="category-icon"></i>
              <span class="category-name">بستنی</span>
              <span class="category-en">ICE CREAM</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

            <button type="button" class="category-button" data-category="tea">
              <i data-lucide="leaf" class="category-icon"></i>
              <span class="category-name">چای و دمنوش</span>
              <span class="category-en">TEA &amp; HERBAL</span>
              <i data-lucide="chevron-left" class="category-arrow"></i>
            </button>

          </nav>

          <section class="contact-section" aria-label="اطلاعات تماس">
            <h2 class="contact-title">اطلاعات تماس و ساعت کاری</h2>
            <ul class="contact-list">
              <li><i data-lucide="map-pin"></i><span>گلستان، کلاله، خیابان امام حسین، روبروی امام حسین ۱۸</span></li>
              <li><i data-lucide="clock"></i><span>ساعت کاری: هر روز ۸ صبح تا ۱۲ شب</span></li>
              <li><i data-lucide="phone"></i><span dir="ltr">۰۹۰۳۸۲۴۲۰۶۷</span></li>
            </ul>
            <div class="social-row">
              <a href="https://instagram.com/niloufar_cafe" target="_blank" rel="noopener" aria-label="اینستاگرام کافه نیلوفر"><i data-lucide="instagram"></i></a>
            </div>
          </section>

          <footer class="home-footer">
            <p class="footer-copy">طعم خوب • حال خوب</p>
            <div class="footer-lotus" aria-hidden="true">✦</div>
          </footer>
        </section>

        <section id="detail-view" class="detail-view" hidden aria-live="polite">
          <div class="detail-top">
            <h2 id="detail-title" class="detail-title"></h2>
            <button type="button" class="back-button" id="back-button">
              <i data-lucide="arrow-right" class="back-icon"></i>
              <span>بازگشت به منو</span>
            </button>
          </div>
          <p id="daily-note" class="daily-note" hidden></p>
          <div id="items-list" class="items-list"></div>
        </section>

      </main>
    </div>
  </div>

  <template id="menu-item-template">
    <article class="menu-item">
      <div class="item-image-wrap">
        <img class="item-image" loading="lazy">
        <span class="featured-badge" hidden title="پیشنهاد ویژه">
          <i data-lucide="star"></i>
        </span>
      </div>
      <div class="item-copy">
        <h3 class="item-name"></h3>
        <p class="item-info"></p>
      </div>
      <p class="item-price"></p>
    </article>
  </template>

  <script src="js/script.js"></script>
</body>
</html>
